# The merge gate. One job, named `ci`, so every pull request reports a check run called `ci`.
#
# Until the scaffold story lands there is nothing to build, so the only gate is orion's mechanical install
# check: it fails when a file orion installed is missing, doubled or broken. The scaffold story adds the
# gate chain from CLAUDE.md section 5 (build, lint, typecheck, full suite) on Windows and Mac runners.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: orion verify
        run: bash .claude/orion/orion.sh verify
