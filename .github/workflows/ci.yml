# The merge gate. One job, named `ci`, run on a Windows and a Mac runner (PRD section 8, CI), so every pull
# request reports `ci (windows-latest)` and `ci (macos-latest)`.
#
# Each runner runs orion's mechanical install check (it fails when a file orion installed is missing, doubled or
# broken), then the gate chain from CLAUDE.md section 5: build, lint, typecheck, full suite. Installers are not
# built here; once this run is green on a push to main, auto-release.yml publishes a version if the app changed.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: orion verify
        shell: bash
        run: bash .claude/orion/orion.sh verify

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: install
        run: npm ci

      # Electron downloads its binary on first use. Several test files start it at once on a fresh runner, and they
      # raced that first download and corrupted it, so it is downloaded once here, before any test runs.
      - name: electron binary
        run: npx --no install-electron

      - name: build
        run: npm run build

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test
