# Publishes Grillo's download site, the static page in site/, to GitHub Pages on every push to main (PRD section 8,
# Distribution). The page reads the latest release itself, so publishing a release needs no new Pages run.
#
# Only the files the page serves are published: the tests beside them stay in the repository. The job runs only once
# Pages is switched on: Settings, Pages, Source "GitHub Actions", and the repository variable PAGES_ENABLED set to
# `true` (Settings, Secrets and variables, Actions, Variables). Until then every run is skipped, not failed.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    # Skipped (not failed) until Pages is on: with Pages off, configure-pages fails and every push to main turns red.
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The job's token can deploy Pages; no step needs git credentials, so none are left in .git/config.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: collect the site
        run: |
          mkdir -p _site
          cp site/index.html site/tokens.css site/latest-release.js _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
